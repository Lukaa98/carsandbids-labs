name: Keep Repo Alive

on:
  schedule:
    - cron: "0 0 1 * *"   # once a month (1st day at 00:00 UTC)
  workflow_dispatch:       # allows manual trigger if needed

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create keep-alive commit
        run: |
          echo "Last keep-alive run: $(date -u)" > keepalive.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add keepalive.txt
          git commit -m "chore: monthly keep-alive" || echo "No changes to commit"
          git push
